services:
  postgres:
    image: postgres:16-alpine
    container_name: payroute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payroute}
      POSTGRES_USER: ${POSTGRES_USER:-payroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payroute_secret}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payroute} -d ${POSTGRES_DB:-payroute}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payroute-net

  redis:
    image: redis:7-alpine
    container_name: payroute-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payroute-net

volumes:
  postgres_data:
  redis_data:

networks:
  payroute-net:
    driver: bridge
